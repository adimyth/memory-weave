# Hand-labelled queries against the 1K fixture (tests/integration/fixture_1k.py).
#
# relevant: the answer is in the store; `expected` names the record ids that answer it and `principal`
# names an agent/user pair that can read them. irrelevant: nothing in the store bears on it, asked by a
# principal with a full view of their scopes; the correct result is empty.
#
# The dense-floor sweep in test_gate_calibration.py scores each floor by whether a relevant query's expected
# record clears it and whether any record clears it for an irrelevant query.

