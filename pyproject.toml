[project]
name = "memory-weave"
version = "0.1.0"
description = "A framework-neutral long-term memory layer for AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0.2",
  "uuid6>=2024.7.10",
]

[project.scripts]
memory-weave = "memory_weave.cli:main"

[project.optional-dependencies]
local-models = [
  "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_weave"]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
  "types-PyYAML>=6.0.12.20250402",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: exercises real local model implementations.",
  "live: calls hosted model implementations and requires MEMORY_WEAVE_LIVE=1.",
  "slow: exercises large fixtures or scale-sensitive behavior.",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["memory_weave"]
warn_unused_configs = true
