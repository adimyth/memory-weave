[project]
name = "retold"
version = "1.1.1"
description = "A framework-neutral long-term memory layer for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Aditya Mishra" }]
keywords = ["agents", "memory", "llm", "retrieval", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0.2",
  "uuid6>=2024.7.10",
]

[project.urls]
Homepage = "https://github.com/adimyth/retold"
Repository = "https://github.com/adimyth/retold"
Documentation = "https://adimyth.in/retold/"

[project.scripts]
retold = "retold.cli:main"

[project.optional-dependencies]
local-models = [
  # 5.x is the first line that runs on transformers 5, which is where the transformers advisories are fixed.
  "sentence-transformers>=5.1,<6",
  "transformers>=5.10",
  "protobuf>=4.25",
  "sentencepiece>=0.2",
]
live = [
  "anthropic>=0.68",
  "openai>=1.0",
  "python-dotenv>=1.0",
]
deepagents = [
  "deepagents>=0.7",
]
crewai = [
    "crewai>=1.15",
]

# `uv sync --extra docs` then `uv run mkdocs serve`; the site is built from README.md, docs/, and the docstrings.
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-include-markdown-plugin>=7.0",
]

[build-system]
# Hatchling 1.30 emits Metadata-Version 2.5, which the current publishing toolchain rejects: `twine check`
# fails with "'2.5' is not a valid metadata version" and an upload would not get past it. 1.29 emits 2.4,
# which carries the PEP 639 license expression this project uses. Raise the ceiling when twine and PyPI
# accept 2.5.
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The source distribution carries the package, not the benchmarks, fixtures, or design documents.
only-include = ["retold", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["retold"]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
  "types-PyYAML>=6.0.12.20250402",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: exercises real local model implementations.",
  "live: calls hosted model implementations and requires RETOLD_LIVE=1.",
  "slow: exercises large fixtures or scale-sensitive behavior.",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["retold", "examples"]
warn_unused_configs = true

[[tool.mypy.overrides]]
# Optional live-run SDKs; installed only with the `live` extra.
module = ["anthropic.*", "openai.*", "dotenv.*", "sentence_transformers.*"]
ignore_missing_imports = true
