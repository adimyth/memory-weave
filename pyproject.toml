[project]
name = "retold"
version = "1.0.1"
description = "A framework-neutral long-term memory layer for AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0.2",
  "uuid6>=2024.7.10",
]

[project.urls]
Homepage = "https://github.com/adimyth/retold"
Repository = "https://github.com/adimyth/retold"
Documentation = "https://adimyth.github.io/retold/"

[project.scripts]
retold = "retold.cli:main"

[project.optional-dependencies]
local-models = [
  "sentence-transformers>=3.0,<5",
  "protobuf>=4.25",
  "sentencepiece>=0.2",
]
live = [
  "anthropic>=0.68",
  "openai>=1.0",
  "python-dotenv>=1.0",
]
deepagents = [
  "deepagents>=0.7",
]
crewai = [
    "crewai>=1.15",
]

# `uv sync --extra docs` then `uv run mkdocs serve`; the site is built from README.md, docs/, and the docstrings.
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "mkdocs-include-markdown-plugin>=7.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The source distribution carries the package, not the benchmarks, fixtures, or design documents.
only-include = ["retold", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["retold"]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
  "types-PyYAML>=6.0.12.20250402",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: exercises real local model implementations.",
  "live: calls hosted model implementations and requires RETOLD_LIVE=1.",
  "slow: exercises large fixtures or scale-sensitive behavior.",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["retold", "examples"]
warn_unused_configs = true

[[tool.mypy.overrides]]
# Optional live-run SDKs; installed only with the `live` extra.
module = ["anthropic.*", "openai.*", "dotenv.*", "sentence_transformers.*"]
ignore_missing_imports = true
