name: release smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 1.2.0

jobs:
  quickstart:
    name: quick start on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: resolve release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_TAG#v}"
          if [ -z "${version}" ]; then version="${INPUT_VERSION}"; fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: install the documented artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python -m pip install "retold[local-models] @ https://github.com/adimyth/retold/releases/download/v${VERSION}/retold-${VERSION}-py3-none-any.whl"
      - name: run the documented quick start
        run: python examples/quickstart.py
      - name: run the utility-aware quick start
        run: python examples/utility_aware_quickstart.py
