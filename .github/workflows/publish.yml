name: publish

# Publishes to PyPI through trusted publishing on a version tag. One-time setup on pypi.org: add a pending
# publisher for project `retold` with owner `adimyth`, repository `retold`, workflow `publish.yml`, and
# environment `pypi`. No API token is stored anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra deepagents --extra crewai
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run pytest -q
      - run: uv build
      - run: |
          test -n "$(ls dist/*.whl)" && test -n "$(ls dist/*.tar.gz)"
          uv run python -c "import tomllib,sys; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; t='${GITHUB_REF_NAME}'; sys.exit(0 if not t.startswith('v') or t=='v'+v else f'tag {t} does not match version {v}')"
      # What the upload itself will check. A metadata version the toolchain does not accept fails here,
      # before a tag has been half published.
      - run: uvx twine check dist/*
      - name: install the wheel into a clean environment and run it
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/clean"
          cp scripts/wheel_smoke.py "${RUNNER_TEMP}/clean/"
          uv venv --python 3.12 "${RUNNER_TEMP}/clean/venv"
          VIRTUAL_ENV="${RUNNER_TEMP}/clean/venv" uv pip install "$(ls dist/*.whl)[deepagents,crewai]"
          cd "${RUNNER_TEMP}/clean"
          ./venv/bin/python wheel_smoke.py --installed
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Off until the trusted publisher exists on pypi.org: `gh variable set PYPI_PUBLISH --body true`, then
    # re-run the tag's workflow. A tag whose upload cannot succeed still gets its build verified above.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/retold/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
